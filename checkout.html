<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopExpress</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <header class="header"></header>

  <div class="checkout-grid">
    <div class="checkout-form">
      <h2>📋 Datos de envío</h2>
      <div id="checkout-alert"></div>
      <form id="checkout-form" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="checkout-nombre" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="checkout-email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="checkout-telefono" placeholder="+51 999 888 777" required>
        </div>
        <div class="form-group">
          <label>Dirección de envío</label>
          <textarea id="checkout-direccion" placeholder="Calle, número, ciudad, referencia" required></textarea>
        </div>
        <div class="form-group">
          <label>Método de pago</label>
          <select id="checkout-pago" required>
            <option value="">Selecciona un método</option>
            <option value="tarjeta">💳 Tarjeta de crédito/débito</option>
            <option value="transferencia">🏦 Transferencia bancaria</option>
            <option value="yape">📱 Yape / Plin</option>
            <option value="contraentrega">💵 Contra entrega</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full">Confirmar compra</button>
      </form>
    </div>
    <div class="checkout-resumen">
      <h2>📦 Resumen</h2>
      <div id="checkout-items"></div>
      <div id="checkout-total" style="margin-top:16px;"></div>
      <div style="margin-top:24px;padding:16px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;">
        <p style="color:#065f46;font-size:0.9rem;font-weight:600;">🔒 Pago 100% seguro</p>
        <p style="color:#065f46;font-size:0.85rem;margin-top:4px;">Tus datos están protegidos con encriptación SSL.</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <h4>ShopExpress</h4>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">Tu tienda online de confianza.</p>
      </div>
      <div>
        <h4>Enlaces</h4>
        <a href="/">Inicio</a>
        <a href="/catalogo.html">Tienda</a>
        <a href="/contacto.html">Contacto</a>
      </div>
      <div>
        <h4>Contacto</h4>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">📞 +51 999 888 777</p>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">✉️ hola@shopexpress.com</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 ShopExpress. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function renderCheckoutResumen() {
      const cart = getCart();
      const itemsDiv = document.getElementById('checkout-items');
      const totalDiv = document.getElementById('checkout-total');

      if (cart.length === 0) {
        itemsDiv.innerHTML = '<p style="color:#94a3b8;">No hay productos en tu carrito</p>';
        totalDiv.innerHTML = '';
        return;
      }

      let itemsHtml = '';
      cart.forEach(item => {
        itemsHtml += `
          <div class="checkout-resumen-item">
            <span>${item.nombre} x${item.cantidad}</span>
            <span>S/ ${(item.precio * item.cantidad).toFixed(2)}</span>
          </div>
        `;
      });

      itemsDiv.innerHTML = itemsHtml;

      const subtotal = getCartTotal();
      const envio = subtotal >= 200 ? 0 : 15;
      totalDiv.innerHTML = `
        <div class="checkout-resumen-item"><span>Subtotal</span><span>S/ ${subtotal.toFixed(2)}</span></div>
        <div class="checkout-resumen-item"><span>Envío</span><span>${envio === 0 ? 'Gratis' : 'S/ ' + envio.toFixed(2)}</span></div>
        <div class="checkout-resumen-item total"><span>Total</span><span>S/ ${(subtotal + envio).toFixed(2)}</span></div>
      `;
    }

    async function handleCheckout(e) {
      e.preventDefault();

      if (!isAuthenticated()) {
        window.location.href = '/login.html?redirect=/checkout.html';
        return;
      }

      const cart = getCart();
      if (cart.length === 0) {
        showToast('Tu carrito está vacío', 'error');
        return;
      }

      const alertDiv = document.getElementById('checkout-alert');
      const direccion = document.getElementById('checkout-direccion').value;
      const total = getCartTotal();
      const envio = total >= 200 ? 0 : 15;
      const totalFinal = total + envio;

      alertDiv.innerHTML = '<div class="alert" style="background:#f0fdf4;color:#10b981;border:1px solid #bbf7d0;">Procesando tu compra...</div>';

      try {
        const { data: pedido, error: pedidoError } = await supabaseClient
          .from('pedidos')
          .insert({
            usuario_id: currentUser.id,
            total: totalFinal,
            direccion,
            estado: 'pagado'
          })
          .select()
          .single();

        if (pedidoError) throw pedidoError;

        const items = cart.map(item => ({
          pedido_id: pedido.id,
          producto_id: item.id,
          cantidad: item.cantidad,
          precio: item.precio
        }));

        const { error: itemsError } = await supabaseClient
          .from('pedido_items')
          .insert(items);

        if (itemsError) throw itemsError;

        clearCart();
        alertDiv.innerHTML = '<div class="alert alert-success">¡Compra realizada con éxito! Gracias por tu pedido.</div>';
        document.getElementById('checkout-form').reset();
        renderCheckoutResumen();

        setTimeout(() => window.location.href = '/', 3000);
      } catch (err) {
        alertDiv.innerHTML = `<div class="alert alert-error">Error: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      initAuth().then(() => {
        if (!isAuthenticated()) {
          window.location.href = '/login.html?redirect=/checkout.html';
          return;
        }
        renderCheckoutResumen();
      });
    });
  </script>
</body>
</html>
