<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PremiumStore</title>
    <meta name="description" content="Accede a tu cuenta PremiumStore.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</head>
<body>

    <header id="main-header"></header>

    <section class="min-h-screen flex items-center justify-center pt-20 pb-20"
        style="background: radial-gradient(ellipse at center, rgba(245,158,11,0.05) 0%, transparent 70%), var(--bg-primary);">
        <div class="w-full max-w-md px-4">
            <div class="bg-card border border-zinc-800 rounded-2xl p-8 animate-scale-in">
                <div class="text-center mb-8">
                    <div class="text-4xl mb-4">✦</div>
                    <h1 class="text-2xl font-extrabold">Bienvenido de Vuelta</h1>
                    <p class="text-gray-400 text-sm mt-2">Ingresa a tu cuenta PremiumStore</p>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="tu@email.com" required>
                    </div>
                    <div>
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-full">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>

                <div class="mt-6 text-center text-sm text-gray-400">
                    ¿No tienes cuenta?
                    <a href="register.html" class="text-amber-500 hover:text-amber-400 font-semibold">Regístrate</a>
                </div>
            </div>
        </div>
    </section>

    <script>
    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = e.target.querySelector('button[type="submit"]');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando...';

        try {
            await Auth.signIn(email, password);
            Toast.show('Sesión iniciada con éxito', 'success');
            setTimeout(() => window.location.href = 'index.html', 1000);
        } catch (err) {
            Toast.show(err.message === 'Invalid login credentials' ? 'Credenciales inválidas' : err.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
        }
    });
    </script>

</body>
</html>
