<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de usuarios del panel de administración.">
  <title>Usuarios | Admin - MiTiendaOnline</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
</head>
<body>
  <a href="#main-content" class="skip-link" aria-label="Saltar al contenido principal">Saltar al contenido principal</a>

  <header class="header" role="banner">
    <div class="header__container">
      <a href="../index.html" class="header__logo" aria-label="Ir al inicio">🛍️ MiTienda</a>
      <button class="header__menu-btn" id="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="header__nav" id="main-nav" role="navigation" aria-label="Navegación principal">
        <a href="../index.html">Volver a Tienda</a>
        <a href="#" id="logout-btn-admin">Cerrar Sesión</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar modo oscuro/claro">🌙</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="main-content" role="main">
    <div class="admin-layout">
      <aside class="admin-sidebar" role="navigation" aria-label="Panel de administración">
        <h3 style="margin-bottom: var(--spacing-md);">Panel Admin</h3>
        <a href="index.html" class="admin-sidebar__link">📊 Dashboard</a>
        <a href="productos.html" class="admin-sidebar__link">📦 Productos</a>
        <a href="eventos.html" class="admin-sidebar__link">📅 Eventos</a>
        <a href="usuarios.html" class="admin-sidebar__link active" aria-current="page">👥 Usuarios</a>
        <hr style="border-color: var(--border-color); margin: var(--spacing-md) 0;">
        <a href="../index.html" class="admin-sidebar__link">🏪 Ver Tienda</a>
      </aside>

      <section class="admin-content" aria-label="Gestión de usuarios">
        <h1>Gestión de Usuarios</h1>
        <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">
          Administra los roles de los usuarios. Solo visible para superadmin.
        </p>
        <div id="admin-usuarios-container">
          <div class="spinner" role="status"><span class="sr-only">Cargando usuarios...</span></div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const isAdminUser = await protegerRutaAdmin();
      if (!isAdminUser) return;

      // Verificar que sea superadmin
      const profile = await getCurrentProfile();
      if (!profile || profile.rol !== 'superadmin') {
        window.location.href = 'index.html';
        return;
      }

      const toggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', savedTheme);
      toggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      document.getElementById('menu-btn').addEventListener('click', () => {
        document.getElementById('main-nav').classList.toggle('open');
      });

      document.getElementById('logout-btn-admin').addEventListener('click', (e) => {
        e.preventDefault();
        cerrarSesion();
      });

      await cargarUsuarios();
    });
  </script>
</body>
</html>
