<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Productos - ShopExpress</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <header class="header"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>Administración</h3>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/productos.html" class="active">📦 Productos</a>
      <a href="/admin/pedidos.html">📋 Pedidos</a>
      <div style="border-top:1px solid rgba(255,255,255,0.1);margin:20px 24px;"></div>
      <a href="/">← Volver a la tienda</a>
    </aside>
    <main class="admin-content" id="admin-productos">
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando productos...</p>
      </div>
    </main>
  </div>

  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadHeader();
      await initAuth();
      loadAdminProductos();
    });
  </script>
</body>
</html>
