<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de eventos del panel de administración.">
  <title>Eventos | Admin - MiTiendaOnline</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
</head>
<body>
  <a href="#main-content" class="skip-link" aria-label="Saltar al contenido principal">Saltar al contenido principal</a>

  <header class="header" role="banner">
    <div class="header__container">
      <a href="../index.html" class="header__logo" aria-label="Ir al inicio">🛍️ MiTienda</a>
      <button class="header__menu-btn" id="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="header__nav" id="main-nav" role="navigation" aria-label="Navegación principal">
        <a href="../index.html">Volver a Tienda</a>
        <a href="#" id="logout-btn-admin">Cerrar Sesión</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar modo oscuro/claro">🌙</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="main-content" role="main">
    <div class="admin-layout">
      <aside class="admin-sidebar" role="navigation" aria-label="Panel de administración">
        <h3 style="margin-bottom: var(--spacing-md);">Panel Admin</h3>
        <a href="index.html" class="admin-sidebar__link">📊 Dashboard</a>
        <a href="productos.html" class="admin-sidebar__link">📦 Productos</a>
        <a href="eventos.html" class="admin-sidebar__link active" aria-current="page">📅 Eventos</a>
        <a href="usuarios.html" class="admin-sidebar__link" id="users-link">👥 Usuarios</a>
        <hr style="border-color: var(--border-color); margin: var(--spacing-md) 0;">
        <a href="../index.html" class="admin-sidebar__link">🏪 Ver Tienda</a>
      </aside>

      <section class="admin-content" aria-label="Gestión de eventos">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--spacing-md); margin-bottom: var(--spacing-lg);">
          <h1>Gestión de Eventos</h1>
          <button class="btn btn-primary" id="btn-nuevo-evento">+ Nuevo Evento</button>
        </div>
        <div id="admin-eventos-container">
          <div class="spinner" role="status"><span class="sr-only">Cargando eventos...</span></div>
        </div>
      </section>
    </div>
  </main>

  <!-- MODAL Evento -->
  <div class="modal-overlay" id="evento-modal">
    <div class="modal" role="dialog" aria-labelledby="evento-modal-title" aria-modal="true">
      <button class="modal__close" id="evento-modal-close">&times;</button>
      <h2 class="modal__title" id="evento-modal-title">Nuevo Evento</h2>
      <form id="evento-form" novalidate>
        <input type="hidden" id="evento-id">
        <div class="form__group">
          <label for="ev-titulo" class="form__label">Título *</label>
          <input type="text" class="form__input" id="ev-titulo" required>
        </div>
        <div class="form__group">
          <label for="ev-descripcion" class="form__label">Descripción</label>
          <textarea class="form__textarea" id="ev-descripcion" rows="3"></textarea>
        </div>
        <div class="form__group">
          <label for="ev-fecha" class="form__label">Fecha *</label>
          <input type="date" class="form__input" id="ev-fecha" required>
        </div>
        <div class="form__group">
          <label for="ev-hora" class="form__label">Hora</label>
          <input type="time" class="form__input" id="ev-hora">
        </div>
        <div class="form__group">
          <label for="ev-lugar" class="form__label">Lugar</label>
          <input type="text" class="form__input" id="ev-lugar" placeholder="Dirección o recinto">
        </div>
        <div class="form__group">
          <label for="ev-imagen" class="form__label">URL de imagen</label>
          <input type="url" class="form__input" id="ev-imagen" placeholder="https://...">
        </div>
        <div id="evento-form-error" class="alert alert-error" style="display:none;" role="alert"></div>
        <div style="display: flex; gap: var(--spacing-md); justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" id="evento-modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const isAdminUser = await protegerRutaAdmin();
      if (!isAdminUser) return;

      const toggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', savedTheme);
      toggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      document.getElementById('menu-btn').addEventListener('click', () => {
        document.getElementById('main-nav').classList.toggle('open');
      });

      document.getElementById('logout-btn-admin').addEventListener('click', (e) => {
        e.preventDefault();
        cerrarSesion();
      });

      await initEventosAdmin();

      const profile = await getCurrentProfile();
      if (profile && profile.rol === 'superadmin') {
        document.getElementById('users-link').style.display = 'flex';
      } else {
        document.getElementById('users-link').style.display = 'none';
      }
    });
  </script>
</body>
</html>
