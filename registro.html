<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - ShopExpress</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <header class="header"></header>

  <div class="form-container">
    <h2>Crear cuenta</h2>
    <p>Regístrate para empezar a comprar</p>
    <div id="alert-container"></div>
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" placeholder="Repite la contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg">Crear cuenta</button>
    </form>
    <div class="form-footer">
      ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <h4>ShopExpress</h4>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">Tu tienda online de confianza.</p>
      </div>
      <div>
        <h4>Enlaces</h4>
        <a href="/">Inicio</a>
        <a href="/catalogo.html">Tienda</a>
        <a href="/contacto.html">Contacto</a>
      </div>
      <div>
        <h4>Contacto</h4>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">📞 +51 999 888 777</p>
        <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;">✉️ hola@shopexpress.com</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 ShopExpress. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const alertDiv = document.getElementById('alert-container');

      if (password !== confirm) {
        alertDiv.innerHTML = '<div class="alert alert-error">Las contraseñas no coinciden</div>';
        return;
      }

      alertDiv.innerHTML = '<div class="alert" style="background:#f0fdf4;color:#10b981;border:1px solid #bbf7d0;">Creando cuenta...</div>';

      const result = await registerUser(email, password, nombre);

      if (result.error) {
        alertDiv.innerHTML = `<div class="alert alert-error">${result.error}</div>`;
      } else {
        alertDiv.innerHTML = '<div class="alert alert-success">¡Cuenta creada! Revisa tu correo para confirmar (o inicia sesión directamente).</div>';
        setTimeout(() => window.location.href = '/login.html', 2000);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      initAuth();
    });
  </script>
</body>
</html>
